[package]
name = "vxg-tensor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "VXG compressed-domain AI model weight codec (.vxt) with fused Apple Metal GPU and CPU SIMD GEMV kernels"
license = "MIT"
build = "build.rs"

[features]
default = []
metal = []

[dependencies]
serde_json = "1"
fancy-regex = "0.17"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[lib]
name = "vxg_tensor"
path = "src/lib.rs"

[[bin]]
name = "vxg-tensor"
path = "src/bin/vxg-tensor.rs"

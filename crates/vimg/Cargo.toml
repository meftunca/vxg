[package]
name = "vimg"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "HTTP/HTTPS Range-native hierarchical wavelet image & animation codec (8/10/12/16-bit HDR, SIMD, zero-dep core lib, wasm32)"
license = "MIT"
authors = ["meftunca"]
repository = "https://github.com/meftunca/vxg"
homepage = "https://meftunca.github.io/vxg/VIMG"
documentation = "https://docs.rs/vimg"
readme = "README.md"
keywords = ["image", "codec", "wavelet", "http-range", "wasm"]
categories = ["multimedia::images", "multimedia::encoding", "compression", "wasm"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**/*.rs",
    "include/vimg.h",
    "web/playground.html",
    "tests/**/*.rs",
]

[features]
default = []
tls = ["dep:rustls", "dep:webpki-roots"]
io = ["dep:image", "tls"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "0.26", optional = true }

[lib]
name = "vimg"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "vimg"
path = "src/bin/vimg.rs"
required-features = ["io"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]

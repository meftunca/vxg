[package]
name = "vimg"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "HTTP-Range-native hierarchical wavelet image codec & compressed-domain transform engine (pure Rust, zero-dep lib, wasm32)"
license = "MIT"

[features]
default = []
io = ["dep:image"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[lib]
name = "vimg"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "vimg"
path = "src/bin/vimg.rs"
required-features = ["io"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]

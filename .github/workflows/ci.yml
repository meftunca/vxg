name: source-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo test --release -p vxg-tensor
      - run: cargo build --release --lib
      - run: python3 examples/ffi/python_example.py
      - run: cargo run --release --example roundtrip
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --lib --target wasm32-unknown-unknown
      - run: node examples/ffi/wasm_example.mjs
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_model.sh
      - uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: reports/*local*
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y liblz4-dev libzstd-dev
      - run: cargo test --release --features bench
      - run: cargo run --release --features bench --bin vxg-bench -- --suite v4 --size-mib 4 --samples 3 --seconds 0.02 --csv reports/ci-benchmark.csv --markdown reports/ci-benchmark.md
      - run: cargo run --release --features bench --bin vxg-bench -- --suite src-unique --samples 3 --seconds 0.02 --csv reports/ci-src-unique.csv
      - run: python3 scripts/check_ratio_gate.py --ci-csv reports/ci-benchmark.csv --src-csv reports/ci-src-unique.csv --real-csv reports/real-public-8t.csv --max-regression-pct 1.0 --max-speed-regression-pct 10.0
      - run: python3 scripts/render_tables.py --check
      - run: cat reports/ci-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-not-a-stable-performance-environment
          path: |
            reports/ci-benchmark.csv
            reports/ci-benchmark.md
  metal-compile-only:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --features metal
      # No Metal device availability/performance claim on a hosted runner.
  vulkan-compile-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools
      - run: cargo build --release --features vulkan
      # Does not claim an actual GPU exists on this runner.
  vimg-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path crates/vimg/Cargo.toml --release
      - run: cargo test --manifest-path crates/vimg/Cargo.toml --release --features io
      - run: cargo clippy --manifest-path crates/vimg/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/vimg/Cargo.toml --all-targets --features io -- -D warnings
      - run: cargo build --manifest-path crates/vimg/Cargo.toml --release --lib --target wasm32-unknown-unknown
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo build --manifest-path crates/vimg/Cargo.toml --release --lib --target wasm32-unknown-unknown
      - run: cargo build --manifest-path crates/vimg/Cargo.toml --release --features io --bin vimg
      - name: C99 ABI header & staticlib smoke test
        shell: bash
        run: |
          cargo build --manifest-path crates/vimg/Cargo.toml --release --lib
          cat <<'EOF' > /tmp/vimg_ci_c99.c
          #include <assert.h>
          #include <string.h>
          #include "vimg.h"
          int main(void) {
              uint8_t px[64 * 64 * 3];
              for (size_t i = 0; i < sizeof(px); i++) px[i] = (uint8_t)((i * 37 + 11) & 0xFF);
              VimgBuf enc = vimg_encode_alloc(px, sizeof(px), 64, 64, 3, 100, 64, 2);
              assert(enc.status == 0 && enc.ptr != NULL);
              VimgQueryC q;
              memset(&q, 0, sizeof(q));
              q.sepia = 1; q.flip_h = 1; q.recover_corrupt = 1; q.contrast = 1.0f;
              VimgBuf dec = vimg_decode_query_v2_alloc(enc.ptr, enc.len, &q);
              assert(dec.status == 0 && dec.width == 64 && dec.height == 64);
              VimgBuf full = vimg_decode_query_v2_alloc(enc.ptr, enc.len, NULL);
              assert(full.status == 0 && full.len == sizeof(px) && memcmp(full.ptr, px, sizeof(px)) == 0);
              VimgBuf no_icc = vimg_extract_icc_alloc(enc.ptr, enc.len);
              assert(no_icc.status == 1 && no_icc.ptr == NULL);
              VimgCicpC cicp;
              assert(vimg_extract_cicp(enc.ptr, enc.len, &cicp) == 0 && cicp.present == 0);
              VimgBuf no_exif = vimg_extract_exif_alloc(enc.ptr, enc.len);
              assert(no_exif.status == 1 && no_exif.ptr == NULL);
              VimgBuf no_xmp = vimg_extract_xmp_alloc(enc.ptr, enc.len);
              assert(no_xmp.status == 1 && no_xmp.ptr == NULL);
              vimg_free(no_xmp); vimg_free(no_exif); vimg_free(no_icc); vimg_free(full); vimg_free(dec); vimg_free(enc);
              return 0;
          }
          EOF
          TARGET_DIR=$(cargo metadata --manifest-path crates/vimg/Cargo.toml --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['target_directory'])")
          cc -std=c99 -Wall -Wextra -Werror -Icrates/vimg/include /tmp/vimg_ci_c99.c "${TARGET_DIR}/release/libvimg.a" -lpthread -ldl -lm -o /tmp/vimg_ci_c99
          /tmp/vimg_ci_c99
          rm -f /tmp/vimg_ci_c99.c /tmp/vimg_ci_c99

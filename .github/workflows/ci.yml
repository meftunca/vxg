name: source-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release --lib
      - run: python3 examples/ffi/python_example.py
      - run: cargo run --release --example roundtrip
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_model.sh
      - uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: reports/*local*
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y liblz4-dev libzstd-dev
      - run: cargo test --release --features bench
      - run: cargo run --release --features bench --bin vxg-bench -- --suite v4 --size-mib 4 --samples 3 --seconds 0.02 --csv reports/ci-benchmark.csv --markdown reports/ci-benchmark.md
      - run: cat reports/ci-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-not-a-stable-performance-environment
          path: |
            reports/ci-benchmark.csv
            reports/ci-benchmark.md
  metal-compile-only:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --features metal
      # No Metal device availability/performance claim on a hosted runner.
  vulkan-compile-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools
      - run: cargo build --release --features vulkan
      # Does not claim an actual GPU exists on this runner.

name: vxg-release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-native:
    name: Build VXG (${{ matrix.target_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            ext: ""
            lib_file: libvxg.a
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target_name: linux-arm64
            ext: ""
            lib_file: libvxg.a
            archive: tar.gz
          - os: macos-latest
            target_name: macos-arm64
            ext: ""
            lib_file: libvxg.a
            archive: tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            ext: ".exe"
            lib_file: vxg.lib
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Determine release version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Run core VXG release tests
        shell: bash
        run: cargo test --release

      - name: Build CLI & staticlib
        shell: bash
        run: |
          cargo build --release --bin vxg
          cargo build --release --lib
          mkdir -p stage/include
          cp "target/release/vxg${{ matrix.ext }}" "stage/vxg${{ matrix.ext }}"
          cp "target/release/${{ matrix.lib_file }}" "stage/${{ matrix.lib_file }}"
          cp include/vxg.h stage/include/vxg.h
          cp README.md stage/README.md

      - name: Package tarball (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/vxg-${{ steps.ver.outputs.version }}-${{ matrix.target_name }}.tar.gz" -C stage .

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path stage\* -DestinationPath "dist\vxg-${{ steps.ver.outputs.version }}-${{ matrix.target_name }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vxg-dist-${{ matrix.target_name }}
          path: dist/*

  build-wasm:
    name: Build VXG (wasm32 + @vxg/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine release version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build stripped wasm32 & pack @vxg/wasm
        shell: bash
        run: |
          mkdir -p dist
          RUSTFLAGS="-C strip=symbols" cargo build --release --lib --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/vxg.wasm "dist/vxg-${{ steps.ver.outputs.version }}.wasm"
          cp "dist/vxg-${{ steps.ver.outputs.version }}.wasm" packages/vxg-wasm/vxg.wasm
          (cd packages/vxg-wasm && npm test && npm pack --pack-destination ../../dist)

      - uses: actions/upload-artifact@v4
        with:
          name: vxg-dist-wasm
          path: dist/*

  publish-release:
    name: Publish Multi-Platform VXG Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd all-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" all-dist/* --clobber
          else
            gh release create "$TAG" all-dist/* \
              --title "VXG v${VER}" \
              --generate-notes
          fi

name: cross-platform-benchmarks
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      size_mib:
        description: "Dataset size in MiB per corpus member"
        required: false
        default: "16"
      seconds:
        description: "Measurement window in seconds per sample"
        required: false
        default: "0.05"
      samples:
        description: "Number of timed samples per operation"
        required: false
        default: "3"
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LZ4 and Zstd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblz4-dev libzstd-dev

      - name: Install LZ4 and Zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 zstd

      - name: Install LZ4 and Zstd (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install lz4:x64-windows zstd:x64-windows
          echo "VXG_LIBRARY_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Build vxg and vxg-bench
        run: cargo build --release --features bench --bins

      - name: Verify CLI hardware report
        run: cargo run --release --bin vxg -- hardware

      - name: Run VXG v4 multi-format benchmark suite
        shell: bash
        run: |
          SIZE="${{ inputs.size_mib || '16' }}"
          SECS="${{ inputs.seconds || '0.05' }}"
          SAMPLES="${{ inputs.samples || '3' }}"
          cargo run --release --features bench --bin vxg-bench -- \
            --suite v4 \
            --size-mib "$SIZE" \
            --seconds "$SECS" \
            --samples "$SAMPLES" \
            --csv "reports/benchmark-${{ matrix.os }}.csv" \
            --markdown "reports/benchmark-${{ matrix.os }}.md"
          cat "reports/benchmark-${{ matrix.os }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark CSV and Markdown table
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            reports/benchmark-${{ matrix.os }}.csv
            reports/benchmark-${{ matrix.os }}.md

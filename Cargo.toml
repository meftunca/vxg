[package]
name = "vxg"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "Experimental bounded-work block codec with CPU SIMD and native GPU backends"
license = "MIT"
build = "build.rs"

[features]
default = []
# Native SDKs are required only when the corresponding feature is selected.
metal = []
vulkan = []
cuda = []
bench = []
# Benchmark-only allocation counters; never enable for normal performance numbers.
alloc-stats = []
# Benchmark-only global allocator A/B switches. Keep them mutually exclusive
# in the benchmark binary; the library never changes its host allocator.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
# Benchmark-only hash-table capacity A/B switches. Default is HASH_BITS=14.
hash13 = []
hash15 = []
# Benchmark-only control build for measuring the incompressible RAW filter.
raw-fastpath-off = []
# Benchmark-only control build for decoder parser inlining.
parser-no-inline = []
# Benchmark-only control build for the generic v2 short-distance parser path.
parser-op7-generic = []
# Benchmark-only control build for unconditional zero-length literal copies.
decode-unconditional-literal-copy = []
# Benchmark-only control build for non-overlapping short-match copy dispatch.
repeat-engine-copy = []
# Benchmark-only control build for fused fixed-size v2 opcode-7 decode.
decode-op7-direct-generic = []
# Benchmark-only control build for checked opcode-7's proven non-overlap copy.
decode-op7-inline-copy-generic = []
# Benchmark-only control build for the bounded unrolled 8..=63-byte opcode-7
# copy. It keeps the same validated non-overlap branch but calls the generic
# pointer copy so the P6 profile can isolate code generation, not semantics.
decode-op7-inline-short-copy-generic = []
# Benchmark-only control build that collects `WorkStats` during timed encode.
encode-with-stats = []

[dependencies]
mimalloc = { version = "0.1.52", optional = true, default-features = false }
tikv-jemallocator = { version = "0.7.0", optional = true, default-features = false }

[lib]
name = "vxg"
path = "src/lib.rs"

[[bin]]
name = "vxg"
path = "src/bin/vxg.rs"

[[bin]]
name = "vxg-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[[bin]]
name = "vxg-energy-workload"
path = "src/bin/energy_workload.rs"
required-features = ["bench"]

[[bin]]
name = "vxg-analyze"
path = "src/bin/analyze.rs"
required-features = ["bench"]

[[bin]]
name = "vxg-pack-eval"
path = "src/bin/pack_eval.rs"
required-features = ["bench"]

[[bin]]
name = "vxg-column-eval"
path = "src/bin/column_eval.rs"
required-features = ["bench"]

[[bin]]
name = "vxg-group-eval"
path = "src/bin/group_eval.rs"
required-features = ["bench"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep unwinding: malformed input and worker failures must not kill an embedding application.

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
exclude = ["fuzz"]

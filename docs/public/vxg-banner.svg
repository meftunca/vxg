<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0C1426"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="glow-1" cx="18%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="84%" cy="62%" r="44%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="33%" stop-color="#F97316"/>
      <stop offset="66%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="vxg-mark" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#hero-bg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glow-1)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glow-2)"/>

  <!-- Subtle Technical Grid -->
  <g stroke="#334155" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Top Spectrum Bar -->
  <rect x="64" y="34" width="1072" height="3" rx="1.5" fill="url(#accent-line)" fill-opacity="0.85"/>

  <!-- Left Brand Emblem -->
  <g transform="translate(64, 68)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0D1629" stroke="url(#vxg-mark)" stroke-width="2.2"/>
    <path d="M18 26 L40 72 L48 58 L32 26 Z" fill="url(#vxg-mark)"/>
    <path d="M78 26 L56 72 L48 58 L64 26 Z" fill="url(#vxg-mark)" fill-opacity="0.82"/>
    <polygon points="48,32 58,45 48,58 38,45" fill="#ECFEFF"/>
    <polygon points="48,37 53.5,45 48,53 42.5,45" fill="url(#vxg-mark)"/>
  </g>

  <!-- Brand Title & Tagline -->
  <text x="184" y="114" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">VXG</text>
  <rect x="314" y="79" width="104" height="32" rx="16" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="366" y="100" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">v0.7.0</text>
  <text x="184" y="150" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="21" font-weight="500">Unified Compressed-Domain Engine · Pure Rust · Zero Core Dependencies</text>

  <!-- 4 Pillar Cards -->
  <g transform="translate(64, 194)">
    <!-- 1: VXG Core -->
    <rect x="0" y="0" width="256" height="92" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="24" cy="28" r="7" fill="#10B981"/>
    <text x="40" y="33" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">VXG Core</text>
    <text x="238" y="33" text-anchor="end" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">v0.7.0</text>
    <text x="18" y="57" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Data/SQL · HTTP Range · Arrow</text>
    <text x="18" y="76" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12">0.1171 ratio · 15/15 vs DuckDB</text>

    <!-- 2: VXG-KV -->
    <rect x="272" y="0" width="256" height="92" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#F97316" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="296" cy="28" r="7" fill="#F97316"/>
    <text x="312" y="33" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">VXG-KV</text>
    <text x="510" y="33" text-anchor="end" fill="#FDBA74" font-family="ui-monospace, monospace" font-size="12" font-weight="700">v0.3.0</text>
    <text x="290" y="57" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Stateless Snapshot Redis</text>
    <text x="290" y="76" fill="#FDBA74" font-family="ui-monospace, monospace" font-size="12">1.85M ops/s · 20x smaller state</text>

    <!-- 3: VXT-Turbo -->
    <rect x="544" y="0" width="256" height="92" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="568" cy="28" r="7" fill="#A855F7"/>
    <text x="584" y="33" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">VXT-Turbo</text>
    <text x="782" y="33" text-anchor="end" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="12" font-weight="700">v0.6.0</text>
    <text x="562" y="57" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">E8 Lattice LLM / VLM / MoE</text>
    <text x="562" y="76" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="12">963 tok/s CUDA · 298 tok/s Metal</text>

    <!-- 4: VIMG -->
    <rect x="816" y="0" width="256" height="92" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="840" cy="28" r="7" fill="#38BDF8"/>
    <text x="856" y="33" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">VIMG</text>
    <text x="1054" y="33" text-anchor="end" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="12" font-weight="700">v0.4.0</text>
    <text x="834" y="57" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">HTTP-Range Wavelet Imaging</text>
    <text x="834" y="76" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="12">Zero-decode crop · 277 KiB WASM</text>
  </g>
</svg>
